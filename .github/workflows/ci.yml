name: CI Pipeline

on:
  push:
    branches: [ develop ]
    tags:
      - 'v*.*.*'  # Semantic versioning tags: v1.0.0, v1.2.3, etc.
  pull_request:
    branches: [ develop ]

# Prevent workflow from running on commits with [skip ci] or [ci skip]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# CKV2_GHA_1: no write-all at top level; jobs that need write set permissions explicitly
permissions: {}

env:
  REGISTRY: docker.io
  DOCKER_HUB_USERNAME: raphaelmoraes
  BASE_IMAGE: raphaelmoraes/digital-step-flow-base-node
  BACKEND_IMAGE: raphaelmoraes/digital-step-flow-backend
  NODEJS_VERSION: '24.13.0-r1'
  NPM_VERSION: '10.9.2'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Extract Node.js version (major.minor.patch)
        id: node_version
        run: |
          # Extract only major.minor.patch from version (e.g., 24.13.0-r1 -> 24.13.0)
          NODE_VERSION=$(echo "${{ env.NODEJS_VERSION }}" | sed 's/-.*//')
          echo "version=${NODE_VERSION}" >> $GITHUB_OUTPUT
          echo "Using Node.js version: ${NODE_VERSION}"
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

  quality-gate-code:
    name: Quality Gate - Source Code
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for repository linters
      
      - name: Run MegaLinter for Source Code
        uses: oxsecurity/megalinter@bacb5f8674e3730b904ca4d20c8bd477bc51b1a7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          APPLY_FIXES: none
          # Exclude infrastructure files and build artifacts
          FILTER_REGEX_EXCLUDE: (k8s/|argocd/|docker-compose\.yml|Dockerfile|\.dockerignore|node_modules|\.git|dist|build|coverage|\.next|\.cache)
          # Enable code-focused linters
          ENABLE: JAVASCRIPT,TYPESCRIPT,BASH
          # Backend uses ESLint, not ts-standard; disable ts-standard to avoid style conflicts
          DISABLE_LINTERS: TYPESCRIPT_TS_STANDARD
          # Disable infrastructure linters and duplicate style checkers
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT_STANDARD,TYPESCRIPT_TS_STANDARD,REPOSITORY_KICS,REPOSITORY_CHECKOV,REPOSITORY_TRIVY,REPOSITORY_DEVSKIM,REPOSITORY_GITLEAKS,REPOSITORY_TRUFFLEHOG,REPOSITORY_GRYPE,REPOSITORY_SECRETLINT,REPOSITORY_DUSTILOCK,REPOSITORY_SYFT,REPOSITORY_TRIVY_SBOM,REPOSITORY_GIT_DIFF,DOCKER,YAML,MARKDOWN,JSON
          # Make some linters non-blocking (warnings only)
          DISABLE_ERRORS_LINTERS: BASH
          LOG_LEVEL: INFO
          PRINT_ALL_FILES: true
          SHOW_ELAPSED_TIME: true

  quality-gate-infra:
    name: Quality Gate - Infra Code
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for repository linters
      
      - name: Run MegaLinter for Infrastructure
        uses: oxsecurity/megalinter@bacb5f8674e3730b904ca4d20c8bd477bc51b1a7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          APPLY_FIXES: none
          # Only include infrastructure files
          FILTER_REGEX_INCLUDE: (k8s/|argocd/|docker-compose\.yml|Dockerfile|\.dockerignore)
          # Enable infrastructure-focused linters
          ENABLE: YAML,DOCKER,REPOSITORY
          # Disable code-focused linters
          DISABLE: COPYPASTE,SPELL,JAVASCRIPT,TYPESCRIPT,JSON,MARKDOWN,BASH
          # Enable infrastructure security scanners
          REPOSITORY_KICS_ENABLE: 'true'
          REPOSITORY_CHECKOV_ENABLE: 'true'
          REPOSITORY_TRIVY_ENABLE: 'true'
          # Skip specific Checkov checks (same as frontend)
          REPOSITORY_CHECKOV_SKIP_CHECK: CKV2_GHA_1
          # Exclude LOW and INFO severity findings from KICS; exclude workflow files (same as frontend)
          REPOSITORY_KICS_ARGUMENTS: "--exclude-severities info,low --exclude-paths .github/workflows/*.yml"
          # Disable DevSkim (XML parse errors with SARIF output; DS162092 flags intentional localhost in Dockerfile/docker-compose)
          DISABLE_LINTERS: REPOSITORY_DEVSKIM
          # Make yamllint non-blocking (warnings only)
          DISABLE_ERRORS_LINTERS: YAML
          FILTER_REGEX_EXCLUDE: (node_modules|\.git|dist|build|coverage|\.next|\.cache)
          LOG_LEVEL: INFO
          PRINT_ALL_FILES: true
          SHOW_ELAPSED_TIME: true

  test:
    name: Test - Backend
    runs-on: ubuntu-latest
    needs: [quality-gate-infra, quality-gate-code]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Extract Node.js version (major.minor.patch)
        id: node_version
        run: |
          # Extract only major.minor.patch from version (e.g., 24.13.0-r1 -> 24.13.0)
          NODE_VERSION=$(echo "${{ env.NODEJS_VERSION }}" | sed 's/-.*//')
          echo "version=${NODE_VERSION}" >> $GITHUB_OUTPUT
          echo "Using Node.js version: ${NODE_VERSION}"
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage/coverage-final.json
          flags: backend

  build:
    name: Build Container Image
    needs: [test]
    runs-on: ubuntu-latest
    # checkov:skip=CKV2_GHA_1: Permissions are specific (contents:write for tags), not write-all
    permissions:
      contents: write  # Required to create tags
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login -u raphaelmoraes --password-stdin
      
      - name: Build and push backend image
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad
        with:
          files: docker-bake.hcl
          targets: backend
          push: true
          set: |
            backend.args.NODEJS_VERSION=${{ env.NODEJS_VERSION }}
            backend.args.BACKEND_IMAGE_VERSION=${{ steps.version.outputs.version }}
            backend.tags=${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
      
      - name: Output image version
        run: |
          echo "IMAGE_VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
          echo "Built image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"

  trivy-scan:
    name: Trivy Vulnerability Scan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Determine version based on branch strategy
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.event.head_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          source scripts/version.sh
          determine_version \
            "$GITHUB_REF_TYPE" \
            "$GITHUB_REF" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_EVENT_PULL_REQUEST_HEAD_REF" \
            "$GITHUB_REF_NAME"
      
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
      
      - name: Pull image for scanning
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          skip-dirs: './.venv'
      
      - name: Save Trivy table output to file
        run: |
          trivy image \
            --skip-version-check \
            --scanners vuln \
            --skip-dirs "./.venv" \
            --ignore-unfixed \
            --format table \
            --severity CRITICAL,HIGH \
            --output trivy-image-backend.txt \
            '${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}' || true
      
      - name: Generate Trivy reports (HTML, XML, SBOM, JSON)
        env:
          IMAGE_REF: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          # Validate IMAGE_REF is set
          if [[ -z "${IMAGE_REF}" ]]; then
            echo "ERROR: IMAGE_REF is empty!" >&2
            echo "BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}" >&2
            echo "VERSION: ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "INFO: Scanning image: ${IMAGE_REF}"
          
          # Download templates
          mkdir -p /tmp/trivy-templates
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o /tmp/trivy-templates/trivy-html.tpl
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl -o /tmp/trivy-templates/trivy-junit.tpl || echo "JUnit template not available, skipping XML report"
          
          # Output options (without exit code to ensure reports are generated)
          TRIVY_OUTPUT_OPTS="--skip-version-check --scanners vuln --skip-dirs ./.venv --ignore-unfixed"
          
          # Generate HTML report
          trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-backend.html --format template --template /tmp/trivy-templates/trivy-html.tpl "${IMAGE_REF}" >/dev/null 2>outerr_html.log || rc_html=$?
          if [[ ${rc_html:-0} -ne 0 && -f "./outerr_html.log" ]]; then
            echo "ERROR: Failed to generate HTML report:" >&2
            cat ./outerr_html.log >&2
          else
            echo "INFO: Scan completed. Result HTML output path $(pwd)/trivy-image-backend.html"
          fi
          
          # Generate XML (JUnit) report
          if [[ -f /tmp/trivy-templates/trivy-junit.tpl ]]; then
            trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-backend.xml --format template --template /tmp/trivy-templates/trivy-junit.tpl "${IMAGE_REF}" >/dev/null 2>outerr_xml.log || rc_xml=$?
            if [[ ${rc_xml:-0} -ne 0 && -f "./outerr_xml.log" ]]; then
              echo "ERROR: Failed to generate XML report:" >&2
              cat ./outerr_xml.log >&2
            else
              echo "INFO: Scan completed. Result XML (Junit) output path $(pwd)/trivy-image-backend.xml"
            fi
          fi
          
          # Generate SBOM report
          trivy image ${TRIVY_OUTPUT_OPTS} -o trivy-image-backend-sbom.json --format cyclonedx "${IMAGE_REF}" >/dev/null 2>outerr_sbom.log || rc_sbom=$?
          if [[ ${rc_sbom:-0} -ne 0 && -f "./outerr_sbom.log" ]]; then
            echo "ERROR: Failed to generate SBOM report:" >&2
            cat ./outerr_sbom.log >&2
          else
            echo "INFO: Scan completed. Result SBOM output path $(pwd)/trivy-image-backend-sbom.json"
          fi
          
          # Generate JSON report
          trivy image ${TRIVY_OUTPUT_OPTS} --format json --output trivy-image-backend.json "${IMAGE_REF}" >/dev/null 2>outerr_json.log || rc_json=$?
          if [[ ${rc_json:-0} -ne 0 && -f "./outerr_json.log" ]]; then
            echo "ERROR: Failed to generate JSON report:" >&2
            cat ./outerr_json.log >&2
          fi
      
      - name: Generate Trivy Report Summary
        if: always()
        env:
          IMAGE_REF: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          echo "## Trivy Vulnerability Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f "trivy-image-backend.json" ]]; then
            # Parse JSON report to extract vulnerability counts
            CRITICAL=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-backend.json 2>/dev/null || echo "0")
            HIGH=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-backend.json 2>/dev/null || echo "0")
            MEDIUM=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-image-backend.json 2>/dev/null || echo "0")
            LOW=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-image-backend.json 2>/dev/null || echo "0")
            TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
            
            # Get image details
            IMAGE_NAME=$(jq -r '.ArtifactName // "unknown"' trivy-image-backend.json 2>/dev/null || echo "${IMAGE_REF}")
            IMAGE_TYPE=$(jq -r '.ArtifactType // "container"' trivy-image-backend.json 2>/dev/null || echo "container")
            
            # Determine status emoji
            if [[ ${CRITICAL} -gt 0 ]] || [[ ${HIGH} -gt 0 ]]; then
              STATUS_EMOJI="❌"
              STATUS="Failed"
            elif [[ ${TOTAL} -eq 0 ]]; then
              STATUS_EMOJI="✅"
              STATUS="Clean"
            else
              STATUS_EMOJI="⚠️"
              STATUS="Warnings"
            fi
            
            echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Target | Type | Status | Critical | High | Medium | Low | Total |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|------|--------|----------|------|--------|-----|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| \`${IMAGE_REF}\` | ${IMAGE_TYPE} | ${STATUS_EMOJI} ${STATUS} | **${CRITICAL}** | **${HIGH}** | ${MEDIUM} | ${LOW} | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [[ ${TOTAL} -eq 0 ]]; then
              echo "✅ **No vulnerabilities detected**" >> $GITHUB_STEP_SUMMARY
            else
              echo "### Vulnerability Breakdown" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              if [[ ${CRITICAL} -gt 0 ]]; then
                echo "- 🔴 **Critical:** ${CRITICAL}" >> $GITHUB_STEP_SUMMARY
              fi
              if [[ ${HIGH} -gt 0 ]]; then
                echo "- 🟠 **High:** ${HIGH}" >> $GITHUB_STEP_SUMMARY
              fi
              if [[ ${MEDIUM} -gt 0 ]]; then
                echo "- 🟡 **Medium:** ${MEDIUM}" >> $GITHUB_STEP_SUMMARY
              fi
              if [[ ${LOW} -gt 0 ]]; then
                echo "- 🟢 **Low:** ${LOW}" >> $GITHUB_STEP_SUMMARY
              fi
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Reports" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Detailed reports are available in the workflow artifacts:" >> $GITHUB_STEP_SUMMARY
            echo "- 📄 [HTML Report](artifact://trivy-reports-backend/trivy-image-backend.html)" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 [JSON Report](artifact://trivy-reports-backend/trivy-image-backend.json)" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 [XML Report (JUnit)](artifact://trivy-reports-backend/trivy-image-backend.xml)" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 [SBOM (CycloneDX)](artifact://trivy-reports-backend/trivy-image-backend-sbom.json)" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 [Text Summary](artifact://trivy-reports-backend/trivy-image-backend.txt)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Warning:** JSON report not found. Unable to generate summary." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload Trivy reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-reports-backend
          path: |
            trivy-image-backend.txt
            trivy-image-backend.json
            trivy-image-backend.html
            trivy-image-backend.xml
            trivy-image-backend-sbom.json
          retention-days: 30

