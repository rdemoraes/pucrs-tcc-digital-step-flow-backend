apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: digital-step-flow

# Remote base from infrastructure repository
resources:
  - https://github.com/raphaelmoraes/pucrs-tcc-digital-step-flow.git/k8s/base?ref=main
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/component: backend

images:
  - name: raphaelmoraes/digital-step-flow-backend
    newName: raphaelmoraes/digital-step-flow-backend
    newTag: latest

