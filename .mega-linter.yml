# MegaLinter configuration
APPLICATION_FIX_ALL: true
APPLICATION_REMOTE: false
APPLICATION_REMOTE_REPORTS: false

# Enable linters
ENABLE: >
  JAVASCRIPT,
  TYPESCRIPT,
  JSON,
  YAML,
  MARKDOWN,
  DOCKER,
  BASH,
  REPOSITORY

# Disable specific linters if needed
DISABLE: >
  COPYPASTE,
  SPELL

# File extensions to lint
FILTER_REGEX_EXCLUDE: >
  (node_modules|\.git|dist|build|coverage|\.next|\.cache)
